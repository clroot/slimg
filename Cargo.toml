[workspace]
resolver = "2"
members = ["crates/slimg-core", "crates/slimg-ffi", "crates/libjxl-sys", "cli"]
exclude = ["gui/src-tauri"]

# Single source of truth for the release version of slimg-core / slimg-ffi /
# slimg (CLI). slimg-libjxl-sys has an independent lifecycle and keeps its
# own version.
[workspace.package]
version = "0.6.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/clroot/slimg"
homepage = "https://github.com/clroot/slimg"

[workspace.dependencies]
slimg-core = { version = "0.6.1", path = "crates/slimg-core" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
